name: Linux Specific Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  linux-specific-test:
    name: Linux-Specific Features Test
    runs-on: ubuntu-latest
    container:
      image: swift:6.0
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Build
      run: swift build
    
    - name: Run full Linux test suite
      run: swift test
    
    - name: Verify environment-controlled logging on Linux
      run: |
        echo "Testing default environment disable functionality..."
        DisableLogger=true swift test --filter consoleEnvironmentDisableTest
        echo "Testing custom environment key handling..."
        CUSTOM_DISABLE=true swift test --filter consoleEnvironmentDisableTest
