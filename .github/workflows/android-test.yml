name: Android Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  android-test:
    name: Android Package Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build and test Swift package on Android
      uses: skiptools/swift-android-action@v2
      with:
        swift-version: '6.2'
        free-disk-space: true
        build-package: true
        build-tests: true
        run-tests: true
